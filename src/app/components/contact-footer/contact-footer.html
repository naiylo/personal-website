<footer class="contact shell" id="contact" aria-labelledby="contact-title">
  <div class="contact-inner">
    <div class="title-row">
      <h2 id="contact-title">Get in touch<span>.</span></h2>
    </div>

    <div class="contact-grid">
      <p>If you want to talk about machine learning, research, or a software project, feel free to write to me.</p>
      <nav aria-label="Contact links">
        <a [href]="'mailto:' + portfolio().email">Email <span aria-hidden="true">&#8599;</span></a>
        <a [href]="portfolio().github" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">&#8599;</span></a>
        <a [href]="portfolio().linkedin" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">&#8599;</span></a>
      </nav>
    </div>
  </div>

  <div class="footer-line">
    <span>&copy; {{ year }} {{ portfolio().name }}</span>
    <span>{{ portfolio().location }}</span>
    <a href="#top">Back to top <span aria-hidden="true">&#8593;</span></a>
  </div>
</footer>
