<section class="work shell" id="work" aria-labelledby="work-title">
  <div appReveal>
    <app-section-heading
      index="01"
      label="Current projects"
      headingId="work-title"
      firstLine="Things I’m"
      secondLine="building."
    />
  </div>

  <div class="projects">
    @for (project of projects(); track project.number) {
      <div appReveal>
        <app-project-card [project]="project" />
      </div>
    }
  </div>
</section>
