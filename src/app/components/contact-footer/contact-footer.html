<footer class="contact shell" id="contact" aria-labelledby="contact-title">
  <div class="contact-inner">
    <div class="contact-copy">
      <h2 id="contact-title">Let’s build something useful.</h2>
      <p>I’m open to projects and conversations about applied AI, research, and dependable software.</p>
    </div>

    <a class="email" [href]="'mailto:' + portfolio().email">
      <span>Get in touch</span>
      <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M3 10h14m0 0-5-5m5 5-5 5" /></svg>
    </a>

    <div class="footer-meta">
      <strong>{{ portfolio().shortName }}</strong>
      <nav aria-label="Contact links">
        <a [href]="portfolio().github" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a [href]="portfolio().linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>
  </div>
</footer>
