<section class="hero shell" id="top" aria-labelledby="hero-title">
  <div class="hero-heading">
    <h1 id="hero-title">
      <span class="line-mask"><span class="headline-line">Oskar</span></span>
      <span class="line-mask"><span class="headline-line">Schiedewitz<span class="accent">.</span></span></span>
    </h1>

    <p class="hero-role">
      Machine learning<br />&amp; AI engineer<span class="pixel-caret" aria-hidden="true"></span>
    </p>
  </div>

  <div class="hero-lower">
    <div class="intro">
      <p>{{ portfolio().intro }}</p>
      <div class="social-links" aria-label="Social profiles">
        <a class="text-link" [href]="portfolio().github" target="_blank" rel="noopener noreferrer">
          GitHub <span aria-hidden="true">&#8599;</span>
        </a>
        <a class="text-link" [href]="portfolio().linkedin" target="_blank" rel="noopener noreferrer">
          LinkedIn <span aria-hidden="true">&#8599;</span>
        </a>
      </div>
    </div>

    <a class="primary-action" href="#work">Explore selected work <span aria-hidden="true">&#8595;</span></a>

    <div class="current-context" aria-label="Current work and studies">
      <article>
        <span>Working at</span>
        <strong>SAP</strong>
        <small>Software &amp; AI Engineering</small>
      </article>
      <article>
        <span>Studying at</span>
        <strong>HPI</strong>
        <small>M.Sc. Computer Science</small>
      </article>
    </div>
  </div>
</section>
