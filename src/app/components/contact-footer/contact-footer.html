<footer class="contact shell" id="contact" aria-labelledby="contact-title">
  <div class="contact-inner" appReveal>
    <p class="eyebrow">04 / Contact</p>
    <div class="title-row">
      <h2 id="contact-title">Get in touch<span>.</span></h2>
    </div>

    <div class="contact-grid">
      <p>If you want to talk about machine learning, research, or a software project, feel free to write to me.</p>
      <nav aria-label="Contact links">
        <a [href]="'mailto:' + portfolio().email">Email <span>↗</span></a>
        <a [href]="portfolio().github" target="_blank" rel="noreferrer">GitHub <span>↗</span></a>
        <a [href]="portfolio().linkedin" target="_blank" rel="noreferrer">LinkedIn <span>↗</span></a>
      </nav>
    </div>
  </div>

  <div class="footer-line">
    <span>© {{ year }} {{ portfolio().name }}</span>
    <span>{{ portfolio().location }}</span>
    <a href="#top">Back to top ↑</a>
  </div>
</footer>
