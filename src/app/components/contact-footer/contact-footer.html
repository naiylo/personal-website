<footer class="contact shell" id="contact" aria-labelledby="contact-title">
  <div class="contact-inner panel">
    <div class="contact-art" aria-hidden="true">
      <div class="pixel-laptop"><span></span><i></i></div>
      <div class="pixel-cup"></div>
      <p>Let’s build<br />something cool!</p>
    </div>

    <div class="contact-copy">
      <span>Get in touch</span>
      <h2 id="contact-title">Interested in working together?</h2>
      <p>I’m open to interesting projects and conversations about AI, research, and useful software.</p>
    </div>

    <div class="contact-actions">
      <a class="email" [href]="'mailto:' + portfolio().email">
        <span class="email-label"><svg aria-hidden="true" viewBox="0 0 20 16"><path d="M1 2.5h18v11H1zM1.5 3l8.5 6 8.5-6" /></svg>Get in touch</span>
        <svg class="action-arrow" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 10h14m0 0-5-5m5 5-5 5" /></svg>
      </a>
      <nav aria-label="Contact links">
        <a [href]="portfolio().github" target="_blank" rel="noopener noreferrer"><svg class="social-mark" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 .7a11.3 11.3 0 0 0-3.58 22.02c.57.1.78-.25.78-.55v-2.1c-3.18.69-3.85-1.35-3.85-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.95.1-.74.4-1.25.72-1.54-2.54-.29-5.2-1.27-5.2-5.65 0-1.25.45-2.27 1.18-3.07-.12-.29-.52-1.46.11-3.03 0 0 .96-.31 3.11 1.17a10.8 10.8 0 0 1 5.66 0c2.16-1.48 3.12-1.17 3.12-1.17.62 1.57.23 2.74.11 3.03.74.8 1.18 1.82 1.18 3.07 0 4.39-2.67 5.35-5.22 5.64.41.36.77 1.05.77 2.12v3.12c0 .3.21.66.79.55A11.3 11.3 0 0 0 12 .7Z" /></svg>GitHub <svg class="external-arrow" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 12 12 4M5 4h7v7" /></svg></a>
        <a [href]="portfolio().linkedin" target="_blank" rel="noopener noreferrer"><span class="linkedin-mark" aria-hidden="true">in</span>LinkedIn <svg class="external-arrow" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 12 12 4M5 4h7v7" /></svg></a>
      </nav>
    </div>
  </div>

</footer>
