<section class="hero shell" id="top" aria-labelledby="hero-title">
  <div class="hero-topline">
    <p class="eyebrow">Portfolio / 2026</p>
    <p class="eyebrow">Potsdam / Germany</p>
  </div>

  <div class="headline-wrap">
    <h1 id="hero-title">
      <span>Building</span>
      <span class="indent">intelligent</span>
      <span>systems<span class="accent">.</span></span>
    </h1>
    <div class="sprite-stage">
      <span class="sprite-label">AI companion / v01</span>
      <app-pixel-sprite variant="bot" />
    </div>
  </div>

  <div class="hero-footer">
    <div class="intro">
      <p>{{ portfolio().intro }}</p>
      <span>AI / ML Engineering · Full-Stack Development</span>
    </div>

    <div class="actions">
      <a class="primary-action" href="#work">Explore projects <span aria-hidden="true">↗</span></a>
      <a class="text-link" [href]="portfolio().github" target="_blank" rel="noreferrer">GitHub ↗</a>
    </div>

    <div class="current">
      <span class="signal" aria-hidden="true"></span>
      <div>
        <span>Currently</span>
        <strong>M.Sc. Computer Science @ HPI</strong>
      </div>
    </div>
  </div>

  <div class="scroll-cue">
    <span>01 / Selected work</span>
    <a href="#work" aria-label="Scroll to selected work">Scroll ↓</a>
  </div>
</section>
