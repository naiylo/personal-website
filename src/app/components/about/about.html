<section class="about shell" id="about" aria-labelledby="about-title">
  <div class="about-inner">
    <app-section-heading headingId="about-title" firstLine="About" secondLine="me." />

    <div class="about-copy">
      @for (paragraph of portfolio().about; track paragraph) {
        <p>{{ paragraph }}</p>
      }
    </div>

    <div class="education" aria-labelledby="education-title">
      <h3 id="education-title">Education</h3>
      @for (item of portfolio().education; track item.period) {
        <article>
          <time>{{ item.period }}</time>
          <div>
            <strong>{{ item.degree }}</strong>
            <span>{{ item.institution }}</span>
            <p>{{ item.detail }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
